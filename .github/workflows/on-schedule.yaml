name: Schedule

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  dispatch:
    name: Dispatch
    runs-on: ubuntu-latest
    steps:
      - run: |-
          gh repo list \
            --jq '.[] | { "owner": .owner.login,1 repo: .name }' \
            --json "name,owner" \
            --limit 1000 \
            --no-archived \
            --source | while read -r inputs; do
            echo "$inputs" | gh workflow run 'on-repo-created.yaml' --json
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
