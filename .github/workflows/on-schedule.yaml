name: >-
  On: Schedule

run-name: >-
  On: Schedule

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  dispatch:
    name: Dispatch
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch
        run: |-
          workflows=(
            'on-repo-created.yaml'
          )

          gh repo list \
            --jq '.[] | { owner: .owner.login, repo: .name }' \
            --json "name,owner" \
            --limit 1000 \
            --no-archived \
            --source | while read -r inputs; do
            for workflow in "${workflows[@]}"; do
              echo "$inputs" | gh workflow --repo '${{ github.repository }}' \
                run "$workflow" --json
            done
          done
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
